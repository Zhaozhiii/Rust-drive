[package]
name = "drive-service"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
