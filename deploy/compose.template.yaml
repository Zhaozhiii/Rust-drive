name: drive
services:
  drive:
    image: DRIVE_IMAGE
    container_name: drive-service
    restart: unless-stopped
    environment:
      CLOUDDRIVE_ROOT: /data
      DRIVE_LISTEN: 0.0.0.0:3104
    volumes:
      - /root/blogweb/clouddrive:/data:rw
    ports:
      - 127.0.0.1:3104:3104
    networks: [ingress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    healthcheck:
      test: [CMD, /drive-service, --healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  nginx:
    image: NGINX_IMAGE
    container_name: blogweb-nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - /srv/drive-service/nginx.conf:/etc/nginx/nginx.conf:ro
      - /root/blogweb/acme:/var/www/acme:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /root/blogweb/clouddrive:/data:ro
    networks: [ingress]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=1m
    mem_limit: 64m
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  ingress:
    external: true
    name: blogweb_default
