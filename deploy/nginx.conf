worker_processes 1;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream drive_backend {
        zone drive_backend 64k;
        server drive-service:3104 resolve;
        keepalive 8;
    }
    client_body_timeout 60s;
    client_header_timeout 15s;
    send_timeout 300s;
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:2m;
    ssl_session_timeout 1d;
    server {
        listen 80 default_server;
        server_name zhiii.top www.zhiii.top;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        location = /clouddrive { return 308 https://drive.zhiii.top/$is_args$args; }
        location = /clouddrive/ { return 308 https://drive.zhiii.top/$is_args$args; }
        location ^~ /api/clouddrive/upload-session { client_max_body_size 17m; proxy_request_buffering off; proxy_pass http://drive_backend; }
        location = /api/clouddrive/upload { client_max_body_size 5500m; proxy_request_buffering off; proxy_pass http://drive_backend; }
        location /api/clouddrive/ { client_max_body_size 64k; proxy_pass http://drive_backend; }
        location /_drive_internal/ { internal; alias /data/; disable_symlinks on; add_header X-Content-Type-Options nosniff always; }
        location / { default_type "text/plain; charset=utf-8"; return 503 "服务已暂停\n"; }
    }
    server {
        listen 80;
        server_name drive.zhiii.top;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 308 https://drive.zhiii.top$request_uri; }
    }
    server {
        listen 80;
        server_name blog.zhiii.top api.zhiii.top;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { default_type "text/plain; charset=utf-8"; return 503 "服务已暂停\n"; }
    }
    server {
        listen 443 ssl;
        server_name drive.zhiii.top;
        ssl_certificate /etc/letsencrypt/live/drive.zhiii.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/drive.zhiii.top/privkey.pem;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'none'; font-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        location ^~ /api/clouddrive/upload-session { client_max_body_size 17m; proxy_request_buffering off; proxy_pass http://drive_backend; }
        location = /api/clouddrive/upload { client_max_body_size 5500m; proxy_request_buffering off; proxy_pass http://drive_backend; }
        location /api/clouddrive/ { client_max_body_size 64k; proxy_pass http://drive_backend; }
        location /_drive_internal/ { internal; alias /data/; disable_symlinks on; add_header X-Content-Type-Options nosniff always; }
        location = / { proxy_pass http://drive_backend; }
        location = /app.js { proxy_pass http://drive_backend; }
        location = /healthz { proxy_pass http://drive_backend; }
        location / { return 404; }
    }
    server {
        listen 443 ssl default_server;
        server_name zhiii.top www.zhiii.top;
        ssl_certificate /etc/letsencrypt/live/zhiii.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zhiii.top/privkey.pem;
        location = /clouddrive { return 308 https://drive.zhiii.top/$is_args$args; }
        location = /clouddrive/ { return 308 https://drive.zhiii.top/$is_args$args; }
        location ^~ /api/clouddrive/upload-session { client_max_body_size 17m; proxy_request_buffering off; proxy_pass http://drive_backend; }
        location = /api/clouddrive/upload { client_max_body_size 5500m; proxy_request_buffering off; proxy_pass http://drive_backend; }
        location /api/clouddrive/ { client_max_body_size 64k; proxy_pass http://drive_backend; }
        location /_drive_internal/ { internal; alias /data/; disable_symlinks on; add_header X-Content-Type-Options nosniff always; }
        location / { default_type "text/plain; charset=utf-8"; return 503 "服务已暂停\n"; }
    }
    server {
        listen 443 ssl;
        server_name blog.zhiii.top;
        ssl_certificate /etc/letsencrypt/live/blog.zhiii.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/blog.zhiii.top/privkey.pem;
        location / { default_type "text/plain; charset=utf-8"; return 503 "服务已暂停\n"; }
    }
    server {
        listen 443 ssl;
        server_name api.zhiii.top;
        ssl_certificate /etc/letsencrypt/live/api.zhiii.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.zhiii.top/privkey.pem;
        location / { default_type "text/plain; charset=utf-8"; return 503 "服务已暂停\n"; }
    }
}
