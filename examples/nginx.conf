# Include inside nginx's http {} block. Use the same data directory as CLOUDDRIVE_ROOT.
server {
    listen 8080;
    server_name localhost;
    client_max_body_size 5500m;
    client_body_timeout 300s;
    send_timeout 300s;
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    add_header X-Content-Type-Options nosniff always;
    location /_drive_internal/ {
        internal;
        alias /absolute/path/to/data/;
        disable_symlinks on;
        # For disk I/O offloading, add this in nginx's main context:
        # thread_pool drive_io threads=2 max_queue=256;
        # Then enable here (requires nginx built with --with-threads):
        # aio threads=drive_io;
    }
    location / {
        proxy_pass http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
